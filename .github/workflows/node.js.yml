name: Frontend CI

on:
  push:
    branches: ["DevBranch", "main"]
  pull_request:
    branches: ["DevBranch", "main"]

permissions:
  contents: read

jobs:
  build:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://watchlist-e2e.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "watchlist-e2e-anon-key"

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run linter
        run: npm run lint -- --no-cache

      - name: Run unit and contract tests
        run: npm test -- --ci --runInBand

      - name: Enforce Portfolio and Top Picks coverage
        run: npm run test:portfolio-top-picks:coverage -- --ci

      - name: Enforce Watchlist coverage
        run: npm run test:watchlist:coverage -- --ci

      - name: Build the app
        run: npm run build

      - name: Preserve coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Mocked browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./client
    # Public dummy values are deliberate. This job never receives production secrets.
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://watchlist-e2e.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "watchlist-e2e-anon-key"
      NEXT_PUBLIC_API_BASE: "http://127.0.0.1:8080"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Check test-server connection cleanup
        run: node --experimental-test-coverage --test --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 tests/e2e/shutdown-server.test.mjs
      - name: Run mocked critical user journeys
        run: npm run test:e2e -- --project=chromium
      - name: Preserve browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7
