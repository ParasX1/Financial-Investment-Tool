name: Backend CI

on:
  push:
    branches: ["DevBranch", "main"]
  pull_request:
    branches: ["DevBranch", "main"]

permissions:
  contents: read

jobs:
  build:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          python -m flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check configured Python style rules
        run: python -m flake8 src tests --count --max-complexity=10 --max-line-length=250 --statistics --ignore=E302,W292,W293,W503,E303,E305,E306,E275,E231,C901

      - name: Run tests with pytest
        run: |
          python -m pytest tests -ra --junitxml=test-results/pytest.xml

      - name: Preserve backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: server/test-results/
          if-no-files-found: ignore
          retention-days: 7
